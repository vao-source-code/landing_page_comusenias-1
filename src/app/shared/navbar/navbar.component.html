<header class="calm-navbar sticky-top" [class.is-scrolled]="isScrolled">
  <div class="container">
    <nav class="navbar navbar-expand-lg py-3" aria-label="Navegación principal">
      <div class="container-fluid px-0">
        <!-- Brand -->
        <a
          class="navbar-brand d-flex align-items-center gap-2 calm-brand"
          routerLink="/"
          (click)="closeMenu('')"
        >
          <img
            src="assets/logo_con_bordes.webp"
            alt="Comuseñas"
            width="32"
            height="32"
            class="calm-brand-icon"
          />
          <span>Comuseñas</span>
        </a>

        <!-- Mobile Toggler -->
        <button
          class="navbar-toggler shadow-none border-0 px-1"
          type="button"
          (click)="toggleMenu()"
          [attr.aria-expanded]="isMenuOpen"
          aria-controls="calmNav"
          aria-label="Abrir menú de navegación"
        >
          <span class="material-symbols-outlined fs-2 text-brand-deep">
            {{ isMenuOpen ? 'close' : 'menu' }}
          </span>
        </button>

        <!-- Clean Nav Links (4ce3c65 style) -->
        <div
          class="collapse navbar-collapse"
          [class.show]="isMenuOpen"
          id="calmNav"
        >
          <ul class="navbar-nav ms-auto gap-3 gap-lg-4 mt-3 mt-lg-0 align-items-lg-center">
            <li *ngFor="let item of navItems" class="nav-item">
              <a
                class="nav-link calm-nav-link p-0"
                [routerLink]="item.route"
                [fragment]="item.fragment"
                [class.active]="activeKey === item.label"
                (click)="closeMenu(item.label)"
              >
                {{ item.label }}
              </a>
            </li>
            <li class="nav-item mt-2 mt-lg-0">
              <a
                href="https://play.google.com/store/apps/details?id=com.ars.comusenias&hl=es_AR"
                target="_blank"
                rel="noopener noreferrer"
                class="btn-calm-nav"
                (click)="closeMenu()"
              >
                <span class="material-symbols-outlined" style="font-size: 17px;" aria-hidden="true">download</span>
                <span>Descargar App</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </div>
</header>
