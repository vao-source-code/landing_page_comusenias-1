<header class="playful-navbar sticky-top" [class.is-scrolled]="isScrolled">
  <!-- Live Scroll Progress Bar -->
  <div class="scroll-progress-track" aria-hidden="true">
    <div class="scroll-progress-fill" [style.width.%]="scrollProgress"></div>
  </div>
  <div class="container">
    <nav class="navbar navbar-expand-lg py-2 py-lg-3" aria-label="Navegación principal">
      <div class="container-fluid px-0">
        <!-- Brand -->
        <a
          class="navbar-brand d-flex align-items-center gap-2 brand-wordmark"
          routerLink="/"
          (click)="closeMenu('')"
        >
          <img
            src="assets/logo_con_bordes.webp"
            alt="Comuseñas"
            width="34"
            height="34"
            class="object-fit-contain"
          />
          <span>Comuseñas</span>
        </a>

        <!-- Mobile Toggler -->
        <button
          class="navbar-toggler playful-toggler border-0 p-2"
          type="button"
          (click)="toggleMenu()"
          [attr.aria-expanded]="isMenuOpen"
          aria-controls="playfulNav"
          aria-label="Abrir menú de navegación"
        >
          <span class="material-symbols-outlined">
            {{ isMenuOpen ? 'close' : 'menu' }}
          </span>
        </button>

        <!-- Nav Links + CTA -->
        <div
          class="collapse navbar-collapse"
          [class.show]="isMenuOpen"
          id="playfulNav"
        >
          <ul class="navbar-nav mx-lg-auto gap-1 gap-lg-2 mt-3 mt-lg-0 align-items-lg-center">
            <li *ngFor="let item of navItems" class="nav-item">
              <a
                class="nav-link playful-nav-link"
                [routerLink]="item.route"
                [fragment]="item.fragment"
                [class.active]="activeKey === item.label"
                (click)="closeMenu(item.label)"
              >
                <span>{{ item.label }}</span>
              </a>
            </li>
          </ul>

          <div class="mt-3 mt-lg-0 d-flex align-items-center gap-2">
            <a
              href="https://play.google.com/store/apps/details?id=com.ars.comusenias&hl=es_AR"
              target="_blank"
              rel="noopener noreferrer"
              class="btn-nav-playful"
              (click)="closeMenu()"
            >
              <span>Descargar gratis</span>
              <span class="material-symbols-outlined nav-arrow" style="font-size: 18px;" aria-hidden="true">download</span>
            </a>
          </div>
        </div>
      </div>
    </nav>
  </div>
</header>
