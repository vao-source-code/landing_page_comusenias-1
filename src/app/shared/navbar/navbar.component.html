<div class="w-100 bg-white position-sticky top-0 z-3" style="border-bottom: 1px solid rgba(0,0,0,0.05);">
  <div class="container">
    <nav class="navbar navbar-expand-lg py-3">
      <div class="container-fluid px-0">
        <a class="navbar-brand font-title-md fw-bold d-flex align-items-center gap-2" href="#" style="color: #4a3b8d;">
          <img style="height: 30px;" src="assets/logo_con_bordes.png">
          Comuseñas
        </a>
        <button class="navbar-toggler shadow-none border-0 px-0" type="button" data-bs-toggle="collapse" data-bs-target="#navigation" aria-controls="navigation" aria-expanded="false" aria-label="Toggle navigation">
          <span class="material-symbols-outlined fs-2" style="color: #4a3b8d;">menu</span>
        </button>
        <div class="collapse navbar-collapse" id="navigation">
          <ul class="navbar-nav ms-auto gap-4 mt-3 mt-lg-0">
            <li *ngFor="let item of sidebarItems" class="nav-item">
              <a 
                class="nav-link p-0 text-on-surface-variant small fw-bold transition" 
                href="{{item.url}}" 
                [class.active]="activeSection === item.url" 
                (click)="activeSection = item.url">{{item.label}}</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </div>
</div>
