<aside *ngIf="adSlot" class="ad-slot-wrapper my-4 my-md-5" aria-label="Espacio publicitario">
  <div class="ad-slot-label font-mono-tech">{{ label }}</div>
  <div class="ad-slot-stage">
    <ins
      class="adsbygoogle"
      style="display: block"
      [attr.data-ad-client]="adClient"
      [attr.data-ad-slot]="adSlot"
      [attr.data-ad-format]="adFormat"
      data-full-width-responsive="true"
    ></ins>
  </div>
</aside>
