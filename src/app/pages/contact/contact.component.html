<section class="swiss-grid-bg py-5">
  <div class="container py-4">
    <div class="playful-card mx-auto" style="max-width: 620px;">
      <div class="text-center mb-4">
        <div class="playful-pill mb-3">
          <span class="material-symbols-outlined" style="font-size: 18px;" aria-hidden="true">mail</span>
          <span>Contacto directo</span>
        </div>
        <h1 class="font-display-md text-ink mb-2">
          Escribinos<span class="accent-square-dot" aria-hidden="true"></span>
        </h1>
        <p class="font-body-md text-on-surface-variant mb-0">
          ¿Tenés dudas, sugerencias o querés sumar Comuseñas en tu escuela o consultorio? Te respondemos a la brevedad.
        </p>
      </div>

      <form action="https://formsubmit.co/comusenias&#64;gmail.com" method="POST" class="text-start">
        <input type="hidden" name="_captcha" value="false" />
        <input type="hidden" name="_next" value="https://xn--comuseas-i3a.com.ar/contacto" />

        <div class="mb-3">
          <label for="name" class="form-label font-label-bold text-ink">Nombre completo</label>
          <input
            type="text"
            class="form-control p-3 rounded-4"
            id="name"
            name="name"
            placeholder="Ej. Juan Pérez"
            autocomplete="name"
            required
          />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label font-label-bold text-ink">Correo electrónico</label>
          <input
            type="email"
            class="form-control p-3 rounded-4"
            id="email"
            name="email"
            placeholder="ejemplo&#64;correo.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="mb-4">
          <label for="message" class="form-label font-label-bold text-ink">Mensaje</label>
          <textarea
            class="form-control p-3 rounded-4"
            id="message"
            name="message"
            rows="5"
            placeholder="Contanos en qué podemos ayudarte..."
            required
          ></textarea>
        </div>

        <button type="submit" class="btn-playful-primary w-100">
          <span>Enviar mensaje</span>
          <span class="material-symbols-outlined" aria-hidden="true">send</span>
        </button>
      </form>
    </div>
  </div>
</section>
